name: Release

# Builds the Windows installer. Triggered manually or by a version tag.
# The installer is small: the whisper.cpp engine and the model are downloaded
# by the app on first use, with a pinned SHA-256, so they are not bundled here.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-installer:
    name: Windows installer (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build installer
        working-directory: apps/desktop
        run: npm run tauri -- build
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forensic-transcriber-next-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      # Attach the installers to a GitHub Release when a version tag is pushed.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
