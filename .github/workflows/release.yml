name: Release

# Reusable build + publish workflow. It is called by the "Release (version)"
# workflow after a version commit and tag exist. It never runs on ordinary main
# pushes, so a push cannot publish a release by itself.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      notes:
        required: false
        type: string
        default: ""
      tag:
        required: false
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  # Direct dispatch is used only for the very first release (v0.1.0) so the
  # bump flow does not turn it into 0.1.1. Later releases go through
  # "Release (version)".
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (ör. 0.1.0). Etiket zaten var olmalı."
        required: true
        type: string
      tag:
        description: "Etiket (boşsa v{version})"
        required: false
        type: string
        default: ""
      notes:
        description: "Release notları"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish signed Windows release
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || format('v{0}', inputs.version) }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || format('v{0}', inputs.version) }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify every version field agrees
        run: node scripts/check-versions.mjs

      - name: Assert tag matches the packaged version
        shell: pwsh
        run: |
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_VERSION -ne $conf) { throw "tag version $env:RELEASE_VERSION != app version $conf" }

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build installers and signed updater artifacts
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: Prepare stable release assets and latest.json
        shell: pwsh
        run: |
          $v = $env:RELEASE_VERSION
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $nsis = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          $nsisSig = "$($nsis.FullName).sig"
          if (-not (Test-Path $nsisSig)) { throw "updater signature not found for $($nsis.Name)" }
          $msi = Get-ChildItem "target/release/bundle/msi/*.msi" | Select-Object -First 1
          $exeName = "ForensicTranscriberNext_${v}_x64-setup.exe"
          Copy-Item $nsis.FullName "$out/$exeName"
          Copy-Item $nsisSig "$out/$exeName.sig"
          if ($msi) { Copy-Item $msi.FullName "$out/ForensicTranscriberNext_${v}_x64.msi" }

          $sig = (Get-Content $nsisSig -Raw).Trim()
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:RELEASE_TAG)/$exeName"
          $manifest = [ordered]@{
            version = $v
            notes = $env:RELEASE_NOTES
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = $sig; url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "$out/latest.json" -Encoding utf8
          Get-ChildItem $out | Format-Table Name, Length

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $out = "release-assets"
          $lines = Get-ChildItem $out -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Path "$out/SHA256SUMS.txt" -Value $lines -Encoding utf8
          Get-Content "$out/SHA256SUMS.txt"

      - name: Validate latest.json before publishing
        shell: pwsh
        run: |
          $m = Get-Content "release-assets/latest.json" -Raw | ConvertFrom-Json
          if (-not $m.version) { throw "latest.json missing version" }
          if ($m.version -ne $env:RELEASE_VERSION) { throw "latest.json version mismatch" }
          $p = $m.platforms.'windows-x86_64'
          if (-not $p) { throw "latest.json missing windows-x86_64 platform" }
          if (-not $p.signature -or $p.signature.Length -lt 40) { throw "latest.json signature is missing or too short" }
          if ($p.url -notmatch "^https://") { throw "latest.json url must be https" }
          if ($p.url -notmatch [regex]::Escape($env:RELEASE_TAG)) { throw "latest.json url does not reference the release tag" }
          Write-Output "latest.json validated: v$($m.version)"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = $env:RELEASE_NOTES
          if (-not $notes) { $notes = "Forensic Transcriber Next $env:RELEASE_TAG" }
          Set-Content -Path "release-notes.md" -Value $notes -Encoding utf8
          gh release create $env:RELEASE_TAG --title "Forensic Transcriber Next $env:RELEASE_TAG" --notes-file release-notes.md release-assets/*
          gh release view $env:RELEASE_TAG --json assets --jq ".assets[].name"
