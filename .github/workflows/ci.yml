name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# A failing check must never produce a successful release artifact: this
# workflow only validates, it does not publish.
jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The Tauri shell is excluded here: on Linux it needs webkit2gtk system
      # libraries. It is compiled separately in the Windows job below.
      - run: cargo clippy --workspace --exclude forensic-transcriber-next --all-targets -- -D warnings
      - run: cargo test --workspace --exclude forensic-transcriber-next

  # Windows packaging requires the WebView2 runtime and native build tools. This
  # job checks that the Tauri shell compiles; producing a signed installer is a
  # separate, documented release procedure that has not been exercised in CI.
  desktop-shell:
    name: Tauri shell (Windows compile check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p forensic-transcriber-next
