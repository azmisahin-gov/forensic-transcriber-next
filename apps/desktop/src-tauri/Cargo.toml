[package]
name = "forensic-transcriber-next"
description = "Forensic Transcriber Next desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "forensic-transcriber-next"

[lib]
name = "ftn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
ureq = { version = "2", features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ftn-domain.workspace = true
ftn-integrity.workspace = true
ftn-application.workspace = true
ftn-media.workspace = true
ftn-transcription.workspace = true
ftn-export.workspace = true
